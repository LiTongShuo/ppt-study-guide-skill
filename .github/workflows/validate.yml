name: Validate PPT Study Guide Skill

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtual environment
        run: python -m venv .venv
      - name: Install dependencies
        run: .\.venv\Scripts\python.exe -m pip install -r requirements-test.txt
      - name: Validate skill metadata
        run: .\.venv\Scripts\python.exe scripts/quick_validate.py .
      - name: Run tests
        run: .\.venv\Scripts\python.exe -m pytest
